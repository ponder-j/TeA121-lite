services:
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    image: tea121-lite-web:latest
    ports:
      - "4173:4173"
    depends_on:
      backend:
        condition: service_healthy
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: tea121-lite-backend:latest
    ports:
      - "8080:8000"
    volumes:
      - ./backend/data:/workspace/data
    environment:
      TEA121_DATABASE_URL: sqlite:////workspace/data/tea121.db
      TEA121_STORAGE_DIR: /workspace/data/files
      TEA121_ANALYZER_COMMAND: tea121
      TEA121_EXTRACTOR: /usr/local/bin/tea121-extract
      TEA121_CLANG: /usr/lib/llvm-15/bin/clang
    working_dir: /workspace
    entrypoint: ["uvicorn"]
    command: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 2s
      timeout: 2s
      retries: 30
  analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    image: tea121-lite:llvm15
    working_dir: /workspace
    volumes:
      - .:/workspace/project:ro
      - ./juliet测试集:/workspace/juliet测试集:ro
      - ./analysis-output:/workspace/output
    environment:
      TEA121_EXTRACTOR: /usr/local/bin/tea121-extract
      TEA121_CLANG: /usr/lib/llvm-15/bin/clang
    entrypoint: ["tea121"]
    command: ["--version"]
